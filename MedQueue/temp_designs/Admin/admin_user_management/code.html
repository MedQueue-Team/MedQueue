<script>
        const roleSelect = document.getElementById('roleSelect');
        const deptContainer = document.getElementById('deptContainer');
        const specContainer = document.getElementById('specContainer');

        roleSelect.addEventListener('change', function() {
            const val = this.value;
            
            if (val === 'DOCTOR') {
                deptContainer.classList.remove('hidden');
                specContainer.classList.remove('hidden');
            } else if (val === 'RECEPTIONIST') {
                deptContainer.classList.remove('hidden');
                specContainer.classList.add('hidden');
            } else {
                deptContainer.classList.add('hidden');
                specContainer.classList.add('hidden');
            }
        });

        // Add subtle hover effect for list items
        document.querySelectorAll('.clinical-shadow').forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.style.transform = 'translateY(-2px)';
                card.style.transition = 'transform 0.2s ease-out';
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'translateY(0)';
            });
        });
    </script>
